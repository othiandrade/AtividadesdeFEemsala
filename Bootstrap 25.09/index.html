<!DOCTYPE html>
<html lang="pt-br">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste-Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
      <div class="container navbar-conteudo">
        <a class="logo" href="#inicio">Grão<span>Nobre</span></a>

        <nav class="menu">
          <a href="#inicio">Inicio</a>
          <a href="#depoimentos">Depoimentos</a>
          <a href="#faq">FAQ</a>
          <label for="modal-toggle" class="btn btn-marca">Comprar agora</label>
        </nav>
      </div>
    </header>

    <!-- MODAL -->

    <main>
      <section id="inicio" class="hero">
        <div class="container hero-grid">
          <div class="hero-texto">
            <h1>Café de origem, torrado com propósito</h1>
            <p>A Grão Nobre trabalha direto com pequenos produtores para levar até você grãos especiais, torrados em lotes pequenos toda semana.
            </p>
        </div>
        <img src="" alt="IMAGEM HERO">
        </div>
      </section>

      <section id="depoimentos" class="depoimentos">
        <div class="container">
          <div class="cabecalho">
            <span class="subtitulo">Quem já experimentou</span>
            <h2>O que dizem nossos clientes</h2>
          </div>
          <!-- Carrossel? -->
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
